<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mosik — design studio</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#F4F4EE;--dark:#1e1e1e;--gray:#888;--border:#ddddd6;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--dark);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);display:flex;align-items:center;padding:0 40px;height:56px;}
.logo{font-size:15px;font-weight:400;color:var(--dark);letter-spacing:0.01em;white-space:nowrap;flex-shrink:0;}
.logo strong{font-weight:700;}
.nav-links{display:flex;gap:2rem;list-style:none;position:absolute;left:0;right:0;justify-content:center;pointer-events:none;}
.nav-links li{pointer-events:all;}
.nav-links a{text-decoration:none;color:var(--dark);font-size:13px;letter-spacing:0.04em;transition:opacity .15s;}
.nav-links a:hover{opacity:0.45;}
.nav-sns{display:flex;gap:1.2rem;margin-left:auto;flex-shrink:0;}
.nav-sns a{text-decoration:none;color:var(--gray);font-size:12px;transition:opacity .15s;}
.nav-sns a:hover{opacity:0.5;}

/* HERO */
#hero{height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:56px 40px 56px;}
.hero-logo-img{width:55%;max-width:820px;mix-blend-mode:multiply;display:block;}

/* WORK */
#work{padding:100px 40px 0;}
.section-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:40px;}
.section-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gray);}

.work-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;width:100%;}
.work-card{cursor:pointer;}
.work-thumb{position:relative;width:100%;aspect-ratio:16/9;background:#e4e3db;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.work-thumb img.img-default{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s ease;}
.work-thumb img.img-hover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease;}
.work-card:hover .img-default{opacity:0;}
.work-card:hover .img-hover{opacity:1;}
.work-thumb-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--gray);}
.work-thumb-placeholder svg{width:28px;height:28px;opacity:0.5;}
.work-thumb-placeholder span{font-size:11px;letter-spacing:0.05em;}
.work-thumb input{display:none;}
.work-overlay{display:none;}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:28px 40px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;}
.footer-logo{font-size:13px;font-weight:700;color:var(--dark);}
.footer-info{font-size:11px;color:var(--gray);text-align:center;line-height:1.8;}
.footer-info a{color:var(--gray);text-decoration:none;}
.footer-info a:hover{opacity:0.6;}
.footer-links{display:flex;gap:20px;justify-content:flex-end;}
.footer-links a{font-size:11px;color:var(--gray);text-decoration:none;transition:opacity .15s;}
.footer-links a:hover{opacity:0.5;}

@media(max-width:768px){
  nav{padding:0 20px;}
  .nav-links{display:none;}
  #hero,#work,footer{padding-left:20px;padding-right:20px;}
  .hero-logo-img{width:75%;}
  .work-grid{grid-template-columns:1fr;gap:0;}
  footer{grid-template-columns:1fr 1fr;}
  .footer-info{display:none;}
}
</style>
</head>
<body>

<nav>
  <div class="logo">STUDIO <strong>Mosik.</strong></div>
  <ul class="nav-links">
    <li><a href="#work">WORK</a></li>
  </ul>
  <div class="nav-sns">
    <a href="https://www.instagram.com/__mosik/" target="_blank">ins.</a>
    <a href="https://www.behance.net/6870b70a" target="_blank">beh.</a>
    <a href="https://vimeo.com/user161968144" target="_blank">vim.</a>
  </div>
</nav>

<!-- HERO -->
<section id="hero">
  <img class="hero-logo-img" src="Mosik_LOGO.png" alt="Mosik."/>
</section>

<!-- WORK -->
<section id="work">
  <div class="section-header">
    <span class="section-label">Selected work</span>
  </div>
  <div class="work-grid" id="workGrid">

    <div class="work-card" data-idx="0">
      <label class="work-thumb">
        <img class="img-default" src="work1.png" alt="work1"/>
        <img class="img-hover" src="work1-hover.png" alt="work1 hover"/>
        <div class="work-overlay"><span><em class="ov-title">Treasure Trove - 先祖의 것</em><em class="ov-sub">수성못 MOTI</em></span></div>
      </label>
    </div>

    <div class="work-card" data-idx="1">
      <label class="work-thumb">
        <img class="img-default" src="work2.png" alt="work2"/>
        <img class="img-hover" src="work2-hover.png" alt="work2 hover"/>
        <div class="work-overlay"><span><em class="ov-title">KAYA Skincare</em></span></div>
      </label>
    </div>

    <div class="work-card" data-idx="2">
      <label class="work-thumb">
        <img class="img-default" src="work3.png" alt="work3"/>
        <img class="img-hover" src="work3-hover.png" alt="work3 hover"/>
        <div class="work-overlay"><span><em class="ov-title">Folio Magazine</em></span></div>
      </label>
    </div>

    <div class="work-card" data-idx="3">
      <label class="work-thumb">
        <img class="img-default" src="work4.png" alt="work4"/>
        <img class="img-hover" src="work4-hover.png" alt="work4 hover"/>
        <div class="work-overlay"></div>
      </label>
    </div>

    <div class="work-card" data-idx="4">
      <label class="work-thumb">
        <div class="work-thumb-placeholder"><span>Coming soon</span></div>
        <div class="work-overlay"></div>
      </label>
    </div>

    <div class="work-card" data-idx="5">
      <label class="work-thumb">
        <div class="work-thumb-placeholder"><span>Coming soon</span></div>
        <div class="work-overlay"></div>
      </label>
    </div>

  </div>
</section>

<footer>
  <div class="footer-logo">STUDIO Mosik.</div>
  <div class="footer-info">
    서울특별시 · 010-4127-0822<br>
    © 2026 Mosik studio. All rights reserved.
  </div>
  <div class="footer-links">
    <a href="https://www.instagram.com/__mosik/" target="_blank">ins.</a>
    <a href="https://www.behance.net/6870b70a" target="_blank">beh.</a>
    <a href="https://vimeo.com/user161968144" target="_blank">vim.</a>
  </div>
</footer>

<script>
document.querySelectorAll('.work-upload').forEach(input => {
  input.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const thumb = input.closest('.work-thumb');
      const overlay = thumb.querySelector('.work-overlay').outerHTML;
      thumb.innerHTML = `<img src="${ev.target.result}" alt="work image"/>` + overlay;
    };
    reader.readAsDataURL(file);
  });
});
</script>
</body>
</html>
